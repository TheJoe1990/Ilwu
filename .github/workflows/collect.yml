name: Archive boards and vessel schedule

on:
  schedule:
    - cron: "7 * * * *"   # hourly; only changed content gets committed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect
        run: python3 collect.py
      - name: Guess where skill runs out
        run: { [ ! -f form_csv_url.txt ] || python3 form_reports.py || echo "form import failed"; } && python3 guess.py && python3 score.py || echo "guess failed; keeping the last one"
      - name: Commit if changed
        run: |
          git add data
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive $(TZ=America/Los_Angeles date +'%F %H:%M')"
          for i in 1 2 3; do git pull --rebase -q -X theirs && git push && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
          exit 1
